# Render the website from committed `_freeze/` — no uv, renv, R, Python,
# or TeX on the runner. TinyTeX is omitted on purpose: `quarto install
# tool tinytex` asks GitHub for rstudio/tinytex-releases and fails with
# 403 when that API is rate-limited (run 39114652200).
# https://quarto.org/docs/publishing/github-pages.html#freezing-computations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "_freeze/**"
      - "index.qmd"
      - "theory/**"
      - "tools/**"
      - "python/**"
      - "R/**"
      - "config/**"
      - "prompts/**"
      - "styles/**"
      - "figures/**"
      - ".github/workflows/publish-quarto-book.yml"

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
