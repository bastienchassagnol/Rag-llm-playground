# Quarto website — only these sources are rendered (see `project.render`).
# Layout inspired by https://github.com/BAUDOTlab/teaching_material
# https://quarto.org/docs/websites/

# =========================
# Project scope and build
# =========================
project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - theory/llm-basics.qmd
    - theory/tools-vs-agents.qmd
    - tools/chatgpt-companions.qmd
    - python/llm-tool-calling.qmd
    - python/basic-mcp-server.qmd
    - python/tabular-foundation-models.qmd
    - R/llm-integration.qmd
    - R/r-vs-python.qmd
    - prompts/index.qmd
    - prompts/linkedin-carousel.qmd
    - prompts/mathematical-researcher.qmd

# =========================
# Website metadata and nav
# =========================
# Top navigation, one menu per theme:
# https://quarto.org/docs/websites/website-navigation.html#top-navigation
# Machine-readable copies of each page (`llms.txt`, `*.llms.md`):
# https://quarto.org/docs/websites/website-llms.html
website:
  title: "LLMs, tools, and agents"
  description: >
    A short course: how large language models work, how RAG, MCP and
    agents differ, then practical implementation in R (`ellmer`) and
    Python.
  site-url: https://bastienchassagnol.github.io/Rag-llm-playground/
  repo-url: https://github.com/bastienchassagnol/Rag-llm-playground
  repo-branch: main
  repo-actions: [edit, issue, source]
  llms-txt: true
  # LinkedIn, Slack, and similar unfurls read Open Graph tags.
  # https://quarto.org/docs/websites/website-tools.html#social-metadata
  open-graph:
    locale: en_GB
    site-name: "LLMs, tools, and agents"
  twitter-card: true
  # Privacy-friendly, cookie-free counts. Register the hostname at
  # https://plausible.io or visits are requested but not stored.
  # https://quarto.org/docs/websites/website-tools.html#analytics
  plausible-analytics: |
    <script defer data-domain="bastienchassagnol.github.io" src="https://plausible.io/js/script.js"></script>
  # Hosted search. `search.json` is written on every render; point an
  # Algolia index at it, then replace the two REPLACE_ME values.
  # The search-only key is public (read-only). Never put an admin key here.
  # https://quarto.org/docs/websites/website-search.html#using-algolia
  search:
    location: navbar
    type: overlay
    algolia:
      index-name: rag-llm-playground
      application-id: REPLACE_ME
      search-only-api-key: REPLACE_ME
      show-logo: true
  navbar:
    background: light
    pinned: true
    search: true
    collapse-below: lg
    left:
      - text: "Home"
        href: index.qmd
      - text: "Theory"
        menu:
          - theory/llm-basics.qmd
          - theory/tools-vs-agents.qmd
      - text: "Hosted tools"
        href: tools/chatgpt-companions.qmd
      - text: "Python"
        menu:
          - python/llm-tool-calling.qmd
          - python/basic-mcp-server.qmd
          - python/tabular-foundation-models.qmd
      - text: "R"
        menu:
          - R/llm-integration.qmd
          - R/r-vs-python.qmd
      - text: "Prompts"
        href: prompts/index.qmd
    tools:
      - icon: linkedin
        href: https://www.linkedin.com/in/bastien-chassagnol-677b67140/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/bastienchassagnol/Rag-llm-playground
        aria-label: GitHub
  page-footer:
    left: |
      <a href="https://www.linkedin.com/in/bastien-chassagnol-677b67140/">Bastien Chassagnol on LinkedIn</a>
    center: |
      Course notes built with
      <a href="https://quarto.org/">Quarto</a>.
      Architecture inspired by
      <a href="https://github.com/BAUDOTlab/teaching_material">BAUDOTlab/teaching_material</a>.
    background: "#f8f9fa"
    border: false

# =========================
# Shared document defaults
# =========================
quarto-required: ">= 1.8.0"
toc: true
toc-depth: 3
number-sections: true
number-depth: 3
tbl-cap-location: bottom
fig-align: center
out-width: "80%"
fig-dpi: 320
from: markdown+emoji
lang: en-GB

# =========================
# Output formats
# =========================
# Sketchy (Bootswatch), then a small course override:
# https://bootswatch.com/sketchy/
# https://quarto.org/docs/websites/website-blog.html#themes
format:
  html:
    page-layout: full
    lightbox: true
    smooth-scroll: true
    code-fold: false
    code-tools: true
    code-overflow: wrap
    code-copy: hover
    crossrefs-hover: true
    footnotes-hover: true
    citations-hover: true
    theme:
      - sketchy
      - styles/sketchy-course.scss
    mainfont: Neucha
    monofont: "DejaVu Sans Mono"

# =========================
# Execution
# =========================
# Freeze: run R / Python / Mermaid locally, store results in `_freeze/`
# (commit that directory). GitHub Actions then renders without uv or renv.
# https://quarto.org/docs/publishing/github-pages.html#freezing-computations
# Use freeze: true (not auto) so CI never re-executes chunks even if a
# source hash looks stale. After changing an executable chapter, always
# `quarto render` locally and commit `_freeze` with the `.qmd`.
execute:
  echo: true
  eval: false
  message: false
  warning: false
  error: false
  freeze: true

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"

editor:
  source: true

license: "MIT"
copyright:
  holder: Bastien Chassagnol
subject: "LLMs, RAG, MCP, agents"
citation: true
